# Every push: type check, lint, build. On main: build the Docker image here (not on the shared server),
# push it to ghcr.io, then SSH to the VPS, upload the deploy files and switch to the new image.
# Repository secrets (Settings → Secrets and variables → Actions) — bootstrap.sh prints them:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS   (optional: DEPLOY_PORT, DEPLOY_PATH)
# Without DEPLOY_HOST the deploy job is skipped. Store id / address / review mode: deploy/site.env.
name: check-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx next typegen          # generates the PageProps / RouteContext route types tsc needs
      - run: npx tsc --noEmit
      - run: npx eslint . --quiet
      - run: npm run test:catalog
      - run: npm run build
        env: { STORE_ID: rodo, DATABASE_URL: "pglite:memory", NEXT_TELEMETRY_DISABLED: "1" }
      - run: npm run test:catalog-ui

  image:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - id: ref
        run: echo "ref=${IMAGE,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: site
        run: grep -E '^(STORE_ID|PUBLIC_BASE_URL|REVIEW_MODE)=' deploy/site.env >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.ref }}
          build-args: |
            STORE_ID=${{ steps.site.outputs.STORE_ID }}
            PUBLIC_BASE_URL=${{ steps.site.outputs.PUBLIC_BASE_URL }}
            REVIEW_MODE=${{ steps.site.outputs.REVIEW_MODE }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, packages: read }
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER_: ${{ secrets.DEPLOY_USER }}
      PORT_: ${{ secrets.DEPLOY_PORT || '22' }}
      DEST: ${{ secrets.DEPLOY_PATH || '/srv/rodo' }}
    steps:
      - name: Deploy configured?
        id: cfg
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_" ]; then
            echo "::notice::DEPLOY_HOST / DEPLOY_USER are not set — deploy skipped (the image is built and stored)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.skip != '1'
      - name: SSH key
        if: steps.cfg.outputs.skip != '1'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$PORT_" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; echo "::warning::DEPLOY_KNOWN_HOSTS not set — trusting the host key seen now"; fi
          printf 'Host target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  ServerAliveInterval 30\n' \
            "$HOST" "$USER_" "$PORT_" > ~/.ssh/config
      - name: Upload deploy files
        if: steps.cfg.outputs.skip != '1'
        # server-only data (.env.production, media/, catalog/, backups/) is excluded, so --delete never touches it
        run: rsync -az --delete --exclude-from=deploy/rsync-exclude.txt ./ "target:$DEST/"
      - name: Switch to the new image
        if: steps.cfg.outputs.skip != '1'
        env:
          REF: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # short-lived job token, passed on stdin (never on a command line) and removed right after the pull
          printf '%s' "$TOKEN" | ssh target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh target "cd '$DEST' && ./deploy/update.sh --image '$REF'; s=\$?; docker logout ghcr.io >/dev/null; exit \$s"
